# flockr — agent sidebar, labels, notes and notifications (github.com/murrayb52/flockr)
# Included at the end of ./config. Every binding here is an i3 binding, so it
# works even while Claude Code or Pi has the keyboard.

# daemon (also opens the sidebar); its log is handy if something looks off
exec_always --no-startup-id flockr daemon 2>>/tmp/flockr-$USER.log

# sidebar window: floating, on every workspace, never takes focus
for_window [class="flockr-sidebar"] floating enable, sticky enable, border none
no_focus [class="flockr-sidebar"]
bindsym $mod+b exec --no-startup-id flockr sidebar toggle

# stacked by default, with slim title strips (the sidebar names the windows).
# This font only sizes i3 title bars; polybar has its own fonts.
workspace_layout stacking
font pango:monospace 1

# agents
bindsym Mod1+slash exec --no-startup-id flockr label
bindsym Mod1+period exec --no-startup-id flockr notes
bindsym $mod+u exec --no-startup-id flockr next
# $mod+n (dunstctl action) in ./config jumps to the agent in a flockr notification

# move the focused window to a position in its stack
bindsym Mod1+Shift+1 exec --no-startup-id flockr slot 1
bindsym Mod1+Shift+2 exec --no-startup-id flockr slot 2
bindsym Mod1+Shift+3 exec --no-startup-id flockr slot 3
bindsym Mod1+Shift+4 exec --no-startup-id flockr slot 4
bindsym Mod1+Shift+5 exec --no-startup-id flockr slot 5
bindsym Mod1+Shift+6 exec --no-startup-id flockr slot 6
bindsym Mod1+Shift+7 exec --no-startup-id flockr slot 7
bindsym Mod1+Shift+8 exec --no-startup-id flockr slot 8
bindsym Mod1+Shift+9 exec --no-startup-id flockr slot 9
