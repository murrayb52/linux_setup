# flockr — labels, notes and notifications for CLI agents in i3
# Included at the end of ./config. Every binding here is an i3 binding, so it
# works even while Claude Code or Pi has the keyboard.

# daemon; its log is handy if something looks off
exec_always --no-startup-id flockr daemon 2>>/tmp/flockr-$USER.log

workspace_layout stacking

# app icons in stacking title bars (Pango markup; matches flockr's tile glyphs)
for_window [class="(?i)firefox|firefox-esr|librewolf|navigator"] title_format "%title" title_window_icon yes
for_window [class="(?i)google-chrome|chromium|brave-browser"] title_format "<span foreground='#1a73e8'>◎</span> %title"
for_window [class="(?i)code|code-oss|vscodium|cursor"] title_format "<span foreground='#1f6feb'>{}</span> %title"
for_window [class="(?i)obsidian"] title_format "<span foreground='#7c5cbf'>◆</span> %title"
for_window [class="(?i)tidal-hifi|spotify|rhythmbox"] title_format "<span foreground='#cccccc'>♪</span> %title"
for_window [class="(?i)thunderbird|tutanota-desktop|evolution|geary"] title_format "<span foreground='#e05c6a'>✉</span> %title"
for_window [class="(?i)slack|discord|signal|telegram.*"] title_format "<span foreground='#9c7dce'>✆</span> %title"
for_window [class="(?i)nautilus|thunar|pcmanfm|dolphin"] title_format "<span foreground='#7a8fa0'>▤</span> %title"
for_window [class="(?i)alacritty|kitty|ghostty|wezterm|foot|xterm|urxvt|konsole|gnome-terminal.*|st-256color"] title_format "<span foreground='#7ee787'>›_</span> %title"

# agents
bindsym Mod1+slash exec --no-startup-id flockr label
bindsym $mod+slash exec --no-startup-id flockr wslabel
bindsym Mod1+period exec --no-startup-id flockr notes
bindsym $mod+u exec --no-startup-id flockr next
bindsym Mod1+u exec --no-startup-id flockr unread
# focus flockr terminal N of this workspace (the number in its title bar)
bindsym Mod1+1 exec --no-startup-id flockr focus 1
bindsym Mod1+2 exec --no-startup-id flockr focus 2
bindsym Mod1+3 exec --no-startup-id flockr focus 3
bindsym Mod1+4 exec --no-startup-id flockr focus 4
bindsym Mod1+5 exec --no-startup-id flockr focus 5
bindsym Mod1+6 exec --no-startup-id flockr focus 6
bindsym Mod1+7 exec --no-startup-id flockr focus 7
bindsym Mod1+8 exec --no-startup-id flockr focus 8
bindsym Mod1+9 exec --no-startup-id flockr focus 9
# $mod+n (dunstctl action) in ./config jumps to the agent in a flockr notification
# override the title of any focused window (empty input resets to default)
bindsym $mod+Shift+n exec --no-startup-id ~/.bin/scripts/name-window.sh
