; Author: Murray Buchanan
; Inspired by: https://github.com/marbinuwusito/dontfiles
;              https://www.reddit.com/r/unixporn/comments/ldicxq/i3gaps_owo/

[color]
highlight  = #aa102010
strong-highlight = #255426
background = #bb010101
text	   = #adc0b0
accent     = #548550
dark-green = #006114
orange     = #bd7023
gray       = #8dabc8

[vars]
spacing = 0
menu-spacing = 4

[bar/main]
monitor = ${env:MONITOR:}
;enable-ipc = true
width = 100%
height = 35
radius = 10
fixed-center = true
override-redirect = false

background = ${color.background}
foreground = ${color.text}

border-left-size = 10
border-right-size = 10
border-top-size = -10

padding-left = 5
padding-right = 5

module-margin-left = 1
module-margin-right = 1 

font-0 = "FontAwesome:size=12;6"
font-1 = Hack-Regular:size=10.5;6
font-2 = "Hack Nerd Font:size=13;6"
; flockr status glyphs (⠋ ✓ ○)
font-3 = "DejaVu Sans:size=10;6"
;font-0 applies to the all icons
;font-1 applies to all bar text
;font-2 (select with %{T3}) is used for the wifi/bluetooth status icons -
;FontAwesome 4 has no wifi/bluetooth state variants, Nerd Font's bundled
;Material Design Icons does (see wifi-status.sh / bluetooth-status.sh)
modules-left = flockr i3-mode
modules-center = time
modules-right = claude-usage wifi-module bluetooth-module mail-module localsend-module
;tray-position = right
;tray-underline = ${color.c4}
line-size = 1.5


[bar/bottom]
monitor = ${env:MONITOR:}
bottom = true
background = ${color.background}
foreground = ${color.text}
width = 100%
height = 45px
;font-0 applies to the icons
font-0 = "FontAwesome:size=12;-3"
;font-1 applies to all bar text
font-1 = "Hack-Regular:size=10.5;-3"
;font-2 applies to the Volume slider
font-2 = "FontAwesome:size=2;-5"

modules-left = cpu separator mem separator disk separator local-ip separator tailscale-ip
modules-right = pulseaudio battery lid power

line-size = 2
border-left-size = 10
border-right-size = 10
border-bottom-size = -15

radius = 10

padding-left = 5
padding-right = 5

module-margin-left = 1
module-margin-right = 1

[module/flockr]
; workspaces with flockr's agent status logo (github.com/murrayb52/flockr):
; ! needs you · ✓ done · spinner working · ○ idle; click to switch
type = custom/script
exec = flockr bar
tail = true
format = <label>
label = %output%

[module/i3-mode]
; current i3 binding mode (e.g. resize), blinking; hidden in the default mode
type = custom/script
exec = ~/.config/polybar/i3-mode.sh
tail = true

[module/time]
type = internal/date
interval = 1
date = %a, %d %b
time = %H:%M
label = %date%  %time%
label-padding = 1


[module/power]
type = custom/menu
expand-left = true
label-open = 
label-close = 
;label-separator = " "
label-open-padding = 3
label-close-padding = 3
label-open-overline = ${color.accent}
label-close-overline = ${color.accent}
label-close-background = ${color.strong-highlight}
label-open-background = ${color.highlight}

;Poweroff menu
menu-0-0 = 
menu-0-0-padding = 2
menu-0-0-background = ${color.highlight}
menu-0-0-exec = #power.open.1
menu-0-0-overline = ${color.accent}
menu-1-0 = cancel
menu-1-0-padding = ${vars.menu-spacing}
menu-1-0-exec = #power.close
menu-1-0-overline = ${color.accent}
menu-1-1 = confirm
menu-1-1-padding = ${vars.menu-spacing}
menu-1-1-exec = poweroff &
menu-1-1-overline = ${color.accent}

;Reboot menu
menu-0-1 = 
menu-0-1-padding = 2
menu-0-1-background = ${color.highlight}
menu-0-1-exec = #power.open.2
menu-0-1-overline = ${color.accent}
menu-2-0 = cancel
menu-2-0-padding = ${vars.menu-spacing}
menu-2-0-exec = #power.close
menu-2-0-overline = ${color.accent}
menu-2-1 = confirm
menu-2-1-padding = ${vars.menu-spacing}
menu-2-1-exec = reboot &
menu-2-1-overline = ${color.accent}

;Logout menu
menu-0-2 = 
menu-0-2-padding = 2
menu-0-2-background = ${color.highlight}
menu-0-2-underline = ${color.accent}
menu-0-2-exec = #power.open.3
menu-0-2-overline = ${color.accent}
menu-3-0 = logout
menu-3-0-padding = ${vars.menu-spacing}
menu-3-0-exec = i3-msg exit
menu-3-0-overline = ${color.accent}
menu-3-1 = cancel
menu-3-1-padding = ${vars.menu-spacing}
menu-3-1-exec = #power.close
menu-3-1-overline = ${color.accent}

; Switch user menu
menu-0-3 = 
menu-0-3-padding = 2
menu-0-3-background = ${color.highlight}
menu-0-3-exec = gdmflexiserver
menu-0-3-overline = ${color.accent}

;Lock menu (via xss-lock, so it's the same blurred lock as Super+Shift+L)
menu-0-4 = 
menu-0-4-padding = 2
menu-0-4-background = ${color.highlight}
menu-0-4-underline = ${color.accent}
menu-0-4-exec = loginctl lock-session
menu-0-4-overline = ${color.accent}

;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Lid switch (sleep on close vs. stay awake)
;; See ~/.bin/scripts/lid-mode.sh for the underlying toggle logic.
;;;;;;;;;;;;;;;;;;;;;;;;;;;
[module/lid]
type = custom/menu
expand-left = true
label-open = ""
label-close = " ✖ "
label-open-padding = 3
label-close-padding = 3
label-open-overline = ${color.accent}
label-close-overline = ${color.accent}
label-close-background = ${color.strong-highlight}
label-open-background = ${color.highlight}

;Rocker switch: pick exactly one of the two, never both, never neither.
menu-0-0 = " Sleep"
menu-0-0-padding = ${vars.menu-spacing}
menu-0-0-background = ${color.highlight}
menu-0-0-exec = ~/.bin/scripts/lid-mode.sh sleep
menu-0-0-overline = ${color.accent}
menu-0-1 = " Awake"
menu-0-1-padding = ${vars.menu-spacing}
menu-0-1-background = ${color.highlight}
menu-0-1-exec = ~/.bin/scripts/lid-mode.sh awake
menu-0-1-overline = ${color.accent}


[module/mem]
type = internal/memory
interval = 1
label =  %gb_free%
format = <label>
label-padding = ${vars.spacing}


[module/cpu]
type = internal/cpu
interval = 1
format = <label>
label =   %percentage%%
label-padding = ${vars.spacing}


[module/disk]
type = internal/fs
mount-0 = /
interval = 10
label-mounted =  %free%
label-mounted-padding = ${vars.spacing}


[module/local-ip]
type = internal/network
interface = wlp1s0
interval = 3
format-connected = <label-connected>
label-connected =   %local_ip%
label-connected-padding = ${vars.spacing}
format-disconnected = <label-disconnected>
label-disconnected = 
label-disconnected-padding = ${vars.spacing}

[module/tailscale-ip]
; this laptop's Tailscale IP, for LocalSend's manual sending when café Wi-Fi isolates clients; grey when Tailscale is down
type = internal/network
interface = tailscale0
interval = 3
format-connected = <label-connected>
label-connected =   %local_ip%
label-connected-padding = ${vars.spacing}
format-disconnected = <label-disconnected>
label-disconnected = 
label-disconnected-foreground = #666
label-disconnected-padding = ${vars.spacing}


[module/battery]
type = internal/battery
full-at = 100
battery = BAT1
adapter = ACAD
poll-interval = 5

; Charging: keep neutral color
format-charging = <label-charging>
format-charging-padding = ${vars.spacing}
label-charging =   %percentage%%

; Discharging/Full: ramp controls icon + color, label shows percentage
format-discharging = <ramp-capacity><label-discharging>
format-discharging-padding = ${vars.spacing}
label-discharging = " %percentage%%%{F-}"

format-full = <ramp-capacity><label-full>
format-full-padding = ${vars.spacing}
label-full = " %percentage%%%{F-}"

; 10-step ramp so we can approximate 10% and 25% thresholds
;  0  =   0–9%   → red
;  1–2 = 10–29%  → orange
;  3–9 = 30–100% → normal text color
ramp-capacity-0 = "%{F#bd2c40} "
ramp-capacity-1 = "%{F#bd7023} "
ramp-capacity-2 = "%{F#bd7023} "
ramp-capacity-3 = "%{F#adc0b0} "
ramp-capacity-4 = "%{F#adc0b0} "
ramp-capacity-5 = "%{F#adc0b0} "
ramp-capacity-6 = "%{F#adc0b0} "
ramp-capacity-7 = "%{F#adc0b0} "
ramp-capacity-8 = "%{F#adc0b0} "
ramp-capacity-9 = "%{F#adc0b0} "

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>  <bar-volume>
label-volume = %percentage%%
format-volume-margin = 0
format-volume-prefix = "  "
format-volume-prefix-foreground = ${color.text}
label-volume-foreground = ${color.text}

label-muted =  Muted
label-muted-foreground = #666

bar-volume-width = 30
bar-volume-indicator =  
bar-volume-indicator-font = 0
bar-volume-fill = %{F#255426}%{F-} 
;    
bar-volume-fill-font = 3

bar-volume-empty = 
bar-volume-empty-font = 3
bar-volume-empty-foreground = ${color.text}


[module/separator]
type = custom/text
format = " "
format-padding = 1.5


[module/wifi-module]
type = custom/script
exec = ~/.config/polybar/wifi-status.sh
interval = 5
click-left = ~/.config/polybar/wifi-menu.sh &
label = %output%
label-padding = 2


[module/bluetooth-module]
type = custom/script
exec = ~/.config/polybar/bluetooth-status.sh
interval = 5
click-left = ~/.config/polybar/bluetooth-menu.sh &
label = %output%
label-padding = 1


[module/claude-usage]
; Claude 5h or 7d usage % and reset time (click to switch); hidden unless an agent is running
type = custom/script
; exec so %pid% is the script itself, not the sh wrapper polybar starts it with
exec = exec ~/.config/polybar/claude-usage.sh
tail = true
click-left = kill -USR1 %pid%
format-padding = 1

[module/mail-module]
type = custom/text
format = 
click-left = ~/.config/polybar/tuta-mail.sh &
format-padding = 1


[module/localsend-module]
type = custom/text
format = 
click-left = ~/.config/polybar/localsend.sh &
format-padding = 1
